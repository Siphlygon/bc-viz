[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcviz"
version = "0.0.1"
dependencies = [
  "pandas",
  "geopandas",
  "requests",
  "playwright"
]
authors = [
  {name = "Ashley Parr", email = "ashley.parr@protonmail.com"}
]
description = "GIS visualisations and spatial analysis of breast cancer data for Greater Manchester"
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICEN[CS]E.*"]

[project.urls]
Repository = "https://github.com/Siphlygon/bcviz"

[tool.setuptools.packages.find]
where = ["."]
include = ["bcviz*"]
exclude = ["docs*", "tests*"]
namespaces = false

[tool.setuptools.package-data]
bcviz = ["*.toml", "*.dat"]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]